[env:waveshare-knob-s3]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi

# This board's reversible USB-C connection uses the onboard USB-to-UART
# bridge (selected by plug orientation), not the S3's native USB CDC pins.
# Serial therefore maps to UART0, which the desktop COM port can reach.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    bblanchon/ArduinoJson@^7.3.0
