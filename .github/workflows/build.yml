name: Build ESP32-S3 MTG firmware with ESP-IDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: Compile native ESP-IDF v6.1 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test MTG1 transfer reference
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate artwork transfer header on native C++ compiler
        run: g++ -std=c++17 -Wall -Wextra -Werror -I main tests/test_art_header.cpp -o /tmp/test_art_header && /tmp/test_art_header
      - name: Verify click-aligned rotary pulses
        run: g++ -std=c++17 -Wall -Wextra -Werror -I main tests/test_rotary.cpp -o /tmp/test_rotary && /tmp/test_rotary
      - name: Build using Espressif's ESP-IDF v6.1 container
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: .
