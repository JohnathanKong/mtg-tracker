name: Build ESP32-S3 MTG firmware with ESP-IDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Compile native ESP-IDF v6.1 firmware
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Test MTG1 transfer reference
        run: python3 -m unittest discover -s tests -p "test_*.py" -v
      - name: Build using Espressif's ESP-IDF v6.1 container
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.1
          target: esp32s3
          path: .
